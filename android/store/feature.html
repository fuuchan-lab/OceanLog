<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<!-- Google Play のフィーチャーグラフィック（1024×500）。ブラウザで開いて 1024×500 で撮る -->
<style>
  html, body { margin: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; display: flex; align-items: center; gap: 48px; padding: 0 64px; box-sizing: border-box;
    background: linear-gradient(160deg, #11729f 0%, #0b3d5c 60%, #082b42 100%); color: #fff;
    font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  img { width: 280px; height: 280px; flex: none; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, .4)); }
  h1 { margin: 0 0 18px; font-size: 64px; letter-spacing: .02em; line-height: 1.1; }
  h1 small { font-size: 34px; font-weight: 600; color: #bfe3f5; margin-left: 12px; }
  p { margin: 0; font-size: 28px; line-height: 1.6; color: #d9eef8; }
  .tags { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
  .tags span { font-size: 22px; padding: 6px 16px; border-radius: 999px; background: rgba(255, 255, 255, .15); }
</style>
<style>img[src="icon-512.png"] { border-radius: 20% !important; }</style>
</head>
<body>
  <img src="icon-512.png" alt="">
  <div>
    <h1>海ログ<small>OceanLog</small></h1>
    <p>ボート・水上バイクで海に出る人の<br>航行支援アプリ。</p>
    <div class="tags"><span>⚓ 海図と航跡</span><span>🌊 波・風・潮</span><span>🌅 日没</span><span>🚢 周りの船</span></div>
  </div>
</body>
</html>
