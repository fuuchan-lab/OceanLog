<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d5c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="海ログ" />
    <meta name="description" content="海ログ — ボート・水上バイクの航行支援アプリ。現在地・航跡・潮汐・日の出日没・風・気圧・波・注意報警報を1つに。記録は自分の Google ドライブに保存" />
    <title>海ログ</title>
    <!-- 選んだ配色を、画面が描かれる前に反映する（ちらつき防止）。詳しい処理は src/theme.ts -->
    <script>
      try {
        var theme = localStorage.getItem('oceanlog-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
